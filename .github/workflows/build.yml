# Basic workflow
name: Build

# Controls when the action will run
# Workflow begins with push or PR events
# Focuses on the master branch only
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Jobs for setting up Python, rendering the site, and checking the build
# with uv and the Quarto publishing system
jobs:
  build-no-deploy:
    runs-on: ubuntu-latest
    steps:
      # Repository
      - name: Check out Repository
        uses: actions/checkout@v3
        with:
          submodules: true
      # Install Quarto
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.5.56
      # Install Python
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync Python dependencies
        run: uv sync --locked
      # Render the site without publishing
      - name: Render without Publishing
        env:
          PYDEVD_DISABLE_FILE_VALIDATION: 1
        run: |
          quarto --version
          uv run quarto render --profile optimize
