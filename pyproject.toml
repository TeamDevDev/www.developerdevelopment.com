[project]
name = "developerdevelopment"
version = "0.1.0"
description = ""
authors = [
    { name = "Gregory M. Kapfhammer", email = "gkapfham@allegheny.edu" },
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "jupyter>=1.0.0,<2.0.0",
    "matplotlib>=3.7.1,<4.0.0",
    "pyyaml>=6.0,<7.0",
    "rich>=13.3.5,<14.0.0",
    "bibtexparser>=1.4.0,<2.0.0",
    "csscompressor>=0.9.5,<0.10.0",
    "rjsmin>=1.2.1,<2.0.0",
    "minify-html>=0.11.1,<0.12.0",
]

[dependency-groups]
dev = [
    "black>=23.3.0,<24.0.0",
    "ruff>=0.16.4",
]

[tool.uv]
# This repository contains a Quarto website, not an installable Python package.
package = false

[tool.ruff]
ignore = [
    "E501", # do not check line length
]
select = [
    "E",    # pycodestyle errors
    "I",    # isort
    "F",    # Pyflakes
    "PL",   # pylint
    "Q",    # flake8-quotes
    "RUF",  # ruff-specific
    "W",    # pycodestyle warnings
    "T201"  # flake8-print
]
